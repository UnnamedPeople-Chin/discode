<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Blurple to Indigo Vibrant Gradient -->
    <linearGradient id="discodePrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5865F2"/>
      <stop offset="60%" stop-color="#4752C4"/>
      <stop offset="100%" stop-color="#00C0FF"/>
    </linearGradient>

    <!-- Glowing cyan highlight for slash -->
    <linearGradient id="discodeCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="100%" stop-color="#00A3FF"/>
    </linearGradient>

    <!-- Subtle Drop Shadow for floating Mascot Icon -->
    <filter id="discodeDropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#5865F2" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Discord Controller Mascot Silhouette (No dark box, 100% transparent background) -->
  <g filter="url(#discodeDropShadow)">
    <path d="M374.5 152C347.8 139.7 319.2 130.8 289.4 126C285.8 132.4 281.7 141 278.8 147.8C247.1 143.1 215.7 143.1 184.4 147.8C181.5 141 177.3 132.4 173.8 126C143.9 130.8 115.3 139.8 88.6 152.1C35.1 231.4 20.6 308.7 27.9 384.8C63.4 410.9 97.8 426.8 131.7 437.3C140.1 426 147.5 413.9 153.8 401.1C141.6 396.5 129.9 390.6 118.8 383.6C121.8 381.4 124.7 379.1 127.5 376.8C194.8 407.7 268.4 407.7 334.8 376.8C337.6 379.1 340.5 381.5 343.5 383.6C332.3 390.7 320.6 396.6 308.3 401.2C314.7 413.9 322.1 426.1 330.5 437.4C364.5 426.9 398.9 411 434.4 384.8C442.8 296.8 420.4 220 374.5 152Z" 
          fill="url(#discodePrimaryGrad)"/>
  </g>

  <!-- Coding Elements inside Discord Mascot: Crisp White Brackets & Cyan Slash -->
  <g>
    <!-- Left Curly Bracket { -->
    <path d="M 198 210 C 168 210, 162 228, 162 248 C 162 260, 144 268, 132 268 C 144 268, 162 276, 162 288 C 162 308, 168 326, 198 326" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="17" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Right Curly Bracket } -->
    <path d="M 314 210 C 344 210, 350 228, 350 248 C 350 260, 368 268, 380 268 C 368 268, 350 276, 350 288 C 350 308, 344 326, 314 326" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="17" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Forward Slash / (Code separator) -->
    <line x1="274" y1="210" x2="238" y2="326" 
          stroke="url(#discodeCyanGrad)" 
          stroke-width="16" 
          stroke-linecap="round"/>
  </g>
</svg>
